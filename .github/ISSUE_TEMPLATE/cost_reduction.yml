name: Cost or token reduction proposal
description: Propose a change that lowers cost or token usage per chapter.
labels: ["cost", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        See [CONTRIBUTING.md §7](../blob/main/CONTRIBUTING.md) for the evaluation criteria.

        Measured baseline across 685 recorded run records:

        | Stage | Median | Mean | p90 | Max |
        |---|---|---|---|---|
        | Full pipeline (Stage 1 + L1) | $0.32 | $0.45 | $0.96 | $1.64 |
        | L2 (cross-chapter) | $0.11 | — | — | — |
        | L3 (cross-grade) | $0.39 | — | — | — |

        All three stages for one chapter ≈ **$0.82 median**.

        Numbers must come from real run records: `run.json` carries `total_cost_usd` and
        `total_usage`. Estimates without run records will be closed.

  - type: textarea
    id: target
    attributes:
      label: Which agent(s) or stage does this target?
      description: >-
        Name the agents (map_extraction, generator, eval, revision, doctor, rules_doctor,
        judge, prerequisite, chapter_relevance, prerequisite_l2, prerequisite_l3) or the
        stage (Stage 1 loop, L1, L2, L3).
    validations:
      required: true

  - type: textarea
    id: current-measured
    attributes:
      label: Current measured cost and tokens
      description: >-
        From `run.json` — `total_cost_usd` and `total_usage`, plus the per-agent breakdown
        for the target. State how many runs and which chapters the numbers come from.
      placeholder: |
        n = 30 runs, CBSE/Science/Grade 8/Chapter01-10
        generator: median 41k input / 3.2k output, $0.14/chapter (44% of pipeline cost)
        total_cost_usd median: $0.32
      render: text
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - Model swap (cheaper model for an agent)
        - Prompt trim (shorter system prompt or smaller context)
        - Prompt caching
        - Batching (fewer, larger calls)
        - Cheaper pre-filter (screen before an expensive call, like chapter_relevance)
        - Deterministic replacement (move logic out of the LLM into skills/)
        - Fewer attempts / earlier stopping
        - Other
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: >-
        Concretely what changes, in which file. If it is a model swap, name the exact model
        ids (from and to). If it is a prompt trim, say what is removed and why it is safe to
        remove.
    validations:
      required: true

  - type: textarea
    id: projected-savings
    attributes:
      label: Projected savings per chapter
      description: Absolute and percentage, in dollars and tokens, against the baseline above.
      placeholder: |
        -$0.06 median per chapter (-19% of full-pipeline cost)
        -12k input tokens per run
    validations:
      required: true

  - type: textarea
    id: quality-impact
    attributes:
      label: Expected quality impact
      description: >-
        Effect on Check-1 pass rate, Check-2 pass rate, and escalation rate. A cost win that
        raises the escalation rate is usually a net loss, because re-runs and human time cost
        more than the saving. If you expect no impact, say why.
      placeholder: |
        Check-1 pass rate: -1pp (within noise at n=30)
        Check-2 pass rate: unchanged
        Escalation rate: unchanged
    validations:
      required: true

  - type: textarea
    id: measurement-plan
    attributes:
      label: How will this be measured?
      description: >-
        Number of runs, which chapters (name them — chapter difficulty dominates cost
        variance, so a single chapter proves nothing), whether before/after use the same
        chapters, and which `run.json` fields you will compare.
      placeholder: |
        n = 20 runs before / 20 after, same chapters:
        CBSE/Science/Grade 8/Chapter01-05, CBSE/Maths/Grade 9/Chapter01-05
        Compare: total_cost_usd, total_usage, per-attempt check1/check2, escalated flag
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Before/after run records
      description: >-
        Attach or link the `run.json` files, or paste the aggregated table. If you have not
        run the experiment yet, say so explicitly and describe it as a proposal to test.

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: The numbers above come from real run records, or I have clearly marked them as untested projections.
          required: true
        - label: This proposal contains no copyrighted curriculum text and no API keys.
          required: true
