name: New agent proposal
description: Propose a new LLM agent for the pipeline.
labels: ["agent-proposal", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read [ARCHITECTURE.md §4–§5](../blob/main/ARCHITECTURE.md) and
        [CONTRIBUTING.md §5](../blob/main/CONTRIBUTING.md) first.

        Every agent adds latency, tokens, and a new failure mode to every run, so the
        design is agreed here before code is written. Proposals without evidence of the
        failure mode will be closed.

        Constraints an agent must satisfy: one responsibility; system prompt in
        `prompts/<name>_prompt.md`; called by the orchestrator and never calling it;
        no filesystem access (only `skills/` does IO); reaches the LLM only through
        `skills/llm.py`; returns `usage` and `cost_usd` so it lands in the run record.

  - type: input
    id: name
    attributes:
      label: Proposed agent name
      description: Module will be `agents/<name>.py` with prompt `prompts/<name>_prompt.md`.
      placeholder: "prerequisite_l4"
    validations:
      required: true

  - type: textarea
    id: failure-mode
    attributes:
      label: Failure mode or gap it addresses
      description: >-
        What goes wrong today, observed in real runs. Be specific: which agent produces the
        bad output, what the output looks like, how often. "Would be nice to have" is not a
        failure mode.
    validations:
      required: true

  - type: textarea
    id: why-not-existing
    attributes:
      label: Why an existing agent or prompt change cannot fix this
      description: >-
        A prompt refinement or a change to Eval/Doctor/Revision is cheaper than a new agent.
        Explain why that route does not work here.
    validations:
      required: true

  - type: textarea
    id: control-flow
    attributes:
      label: Where it slots into the control flow
      description: >-
        Which existing agent it follows and which it precedes, referencing the flowchart in
        ARCHITECTURE §5. State whether it runs on every run, conditionally, or as a separate
        stage — and what happens when it fails.
      placeholder: |
        Runs after: Prerequisites L3
        Runs before: save confirmed CSV
        Condition: only when every subject in the grade has L1 edges
        On failure: returns empty edges + warnings; pipeline continues
    validations:
      required: true

  - type: textarea
    id: input-contract
    attributes:
      label: Input contract
      description: Exact arguments, with types. Note which skills load them and from where.
      render: python
      placeholder: |
        def map_edges(
            target_rows: list[dict],
            candidate_pool: dict[str, dict],
            model: str | None = None,
        ) -> dict:
    validations:
      required: true

  - type: textarea
    id: output-contract
    attributes:
      label: Output contract
      description: >-
        Exact returned dict shape, including `usage` and `cost_usd`. If it adds CSV columns,
        name them and give the cell format.
      render: json
    validations:
      required: true

  - type: textarea
    id: kb-paths
    attributes:
      label: New KB paths needed
      description: >-
        Any new file, folder, or filename in the knowledge base. Reminder: these go in
        `skills/kb_access.py` and nowhere else — no other module may build a path from
        `KB_ROOT`. Write "none" if it only consumes existing data.
      placeholder: "none"
    validations:
      required: true

  - type: dropdown
    id: prompt-file
    attributes:
      label: Does it need a new prompt file?
      options:
        - "Yes — a new prompts/<name>_prompt.md"
        - "No — reuses an existing prompt"
        - "No LLM call at all (deterministic; may belong in skills/ instead)"
    validations:
      required: true

  - type: textarea
    id: quality-impact
    attributes:
      label: Expected effect on escalation rate / Check-1 / Check-2 pass rates
      description: Give numbers and say how you arrived at them.
      placeholder: |
        Escalation rate: 17% -> ~11% (from 40 hand-labelled escalations, 24 share this cause)
        Check-1 pass rate: unchanged
        Check-2 pass rate: +4pp
    validations:
      required: true

  - type: textarea
    id: cost-delta
    attributes:
      label: Expected cost and token delta per chapter
      description: >-
        Baseline from 685 run records — full pipeline median $0.32 (mean $0.45, p90 $0.96,
        max $1.64); L2 median $0.11; L3 median $0.39; all three stages ≈ $0.82 median.
        State the added or saved cost against that, plus input/output tokens per call and
        calls per chapter.
      placeholder: |
        +1 call/chapter, ~18k input / 2k output tokens
        +$0.04 median per chapter; net -$0.03 if it prevents one revision round
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or prior experiment
      description: >-
        Run records, a prototype branch, a hand-labelled sample, or a transcript showing
        both that the failure mode is real and that this agent addresses it. Link the
        `run.json` files.
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I have read CONTRIBUTING.md §5 and this agent satisfies the module constraints listed there.
          required: true
        - label: This proposal contains no copyrighted curriculum text and no API keys.
          required: true
